name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK output
        run: |
          echo "Searching for release APK..."
          find app/build/outputs/apk/release -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was generated."
            echo "Full release output:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Found APK: $APK"

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
